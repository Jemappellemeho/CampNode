version: '3.9'

services:

  # ─────────────────────────────────────────
  # PostgreSQL Datenbank (mit pgvector)
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # KEIN ports: — Datenbank ist nur innerhalb von Docker erreichbar!
    # Früher war "5432:5432" hier — das hat die DB offen ins Internet gestellt.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # Backend — Node.js / Express
  # ─────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    # KEIN ports: — Caddy leitet /api/* intern an backend:3000 weiter.
    # Von außen ist Port 3000 nicht erreichbar — nur Caddy darf zum Backend.
    environment:
      NODE_ENV: production
      PORT: 3000

      # Datenbank (zeigt auf den postgres-Container)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      # Session (für SSO State/Nonce-Speicherung)
      SESSION_SECRET: ${SESSION_SECRET}

      # CORS — muss auf die echte Domain gesetzt werden
      CORS_ORIGIN: ${CORS_ORIGIN}

      # Frontend-URL (für SSO-Callback-Redirects)
      FRONTEND_URL: ${FRONTEND_URL}

      # AI-Service (zeigt auf den ai-service-Container)
      AI_SERVICE_URL: http://ai-service:8001

      # KI-Provider für Quiz/Summary (Mistral)
      AI_PROVIDER: ${AI_PROVIDER:-mistral}
      GROQ_BASE_URL: ${AI_BASE_URL}
      GROQ_MODEL: ${AI_CHAT_MODEL:-mistral}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}

      # OAuth2 / SSO (Uni)
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_ISSUER_URL: ${OAUTH2_ISSUER_URL}
      OAUTH2_CALLBACK_URL: ${OAUTH2_CALLBACK_URL}

      # Redis (Token Blacklist)
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Prisma-Migration beim Start automatisch ausführen
    command: sh -c "npx prisma migrate deploy && node src/server.js"

  # ─────────────────────────────────────────
  # AI-Service — Python / FastAPI / RAG
  # ─────────────────────────────────────────
  ai-service:
    build: ./ai-service
    restart: unless-stopped
    # KEIN ports: — Caddy leitet /ai/* intern an ai-service:8001 weiter.
    environment:
      # Mistral (Uni self-hosted) — OpenAI-kompatibler Endpoint
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-mistral}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-nomic-embed-text}

      # Supabase für pgvector (Embeddings)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

  # ─────────────────────────────────────────
  # Redis — Token Blacklist & Caching
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # KEIN ports: — nur intern erreichbar
    volumes:
      - redis_data:/data

  # ─────────────────────────────────────────
  # Caddy — Reverse Proxy + automatisches HTTPS
  # ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Nur Caddy ist von außen erreichbar — alles andere bleibt intern
      - "80:80"    # HTTP (wird automatisch auf HTTPS weitergeleitet)
      - "443:443"  # HTTPS
    environment:
      # Domain für das Let's-Encrypt-Zertifikat (z.B. campnode.de)
      DOMAIN: ${DOMAIN}
    volumes:
      # Caddy-Konfigurationsdatei
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Gebautes Frontend (erst `cd client && npm run build` ausführen!)
      - ./client/dist:/srv/frontend:ro
      # Caddy speichert hier das Let's-Encrypt-Zertifikat — darf nicht verloren gehen!
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ai-service

volumes:
  postgres_data:
  redis_data:
  caddy_data:    # Let's-Encrypt-Zertifikat wird hier gespeichert
  caddy_config:
